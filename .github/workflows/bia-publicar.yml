# Testa a página de teste e o núcleo da Bia a cada mudança em ia-atendimento/.
# A Bia de produção (Instagram da Kronos) é publicada pelo repositório Kronos-Phone, no Supabase da Kronos.
name: Testar a Bia

on:
  workflow_dispatch:
  push:
    branches: [main, claude/adoring-knuth-iddhd6]
    paths: ['ia-atendimento/**', '.github/workflows/bia-publicar.yml']

jobs:
  testar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ia-atendimento
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Testar o motor de cálculo
        run: npm test
      - name: Testar o servidor do Instagram
        run: npm run test:servidor
